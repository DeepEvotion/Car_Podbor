variables:
  DOCKER_ARTIFACTORY_REGISTRY: registry.spirit.t-education.com
  APP_PORT: "80"
  DEPLOY_USER: root
  APP_IMAGE: "$DOCKER_ARTIFACTORY_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA"
  DEPLOY_IMAGE: "$DOCKER_ARTIFACTORY_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:latest"

stages:
  - build
  - setup
  - deploy

# Spirit's shared template provides the Kaniko executor and registry login via
# SPIRIT_DOCKER_SA_KEY. The repository must have access to pipelines/pipelines.
include:
  - project: pipelines/pipelines
    ref: master
    file: /templates/dp_build.yml

build:image:
  extends: .dp_build
  stage: build
  variables:
    IMAGE: "$APP_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'

setup:vm:
  stage: setup
  image: ${DEPLOY_IMG:-cicd-images/base-noble}
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - command -v ssh >/dev/null || (apt-get update && apt-get install -y openssh-client)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >-
      ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST"
      'set -eu; command -v sudo >/dev/null; command -v docker >/dev/null; docker compose version >/dev/null; command -v dp >/dev/null || { echo "dp is required on the VM for Spirit Registry login"; exit 1; }'

deploy:vm:
  stage: deploy
  image: ${DEPLOY_IMG:-cicd-images/base-noble}
  needs:
    - job: build:image
      artifacts: false
    - job: setup:vm
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - command -v ssh >/dev/null || (apt-get update && apt-get install -y openssh-client)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - export REMOTE_DIR=/opt/carmatch
    - >-
      ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST"
      "sudo mkdir -p $REMOTE_DIR && sudo chown $DEPLOY_USER:$DEPLOY_USER $REMOTE_DIR"
    - scp -i ~/.ssh/deploy_key deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:/tmp/carmatch-compose.yml"
    - scp -i ~/.ssh/deploy_key "$SPIRIT_DOCKER_SA_KEY" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/carmatch-registry-key.json"
    - >-
      ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST"
      "sudo mv /tmp/carmatch-compose.yml $REMOTE_DIR/docker-compose.yml"
    - >-
      ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST"
      "sudo mv /tmp/carmatch-registry-key.json $REMOTE_DIR/registry-key.json && sudo chmod 600 $REMOTE_DIR/registry-key.json && sudo dp auth service-acc --key-file $REMOTE_DIR/registry-key.json && sudo dp auth configure-docker"
    - >-
      ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST"
      "printf '%s' '$APP_IMAGE' | sudo tee $REMOTE_DIR/.image >/dev/null"
    - >-
      ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST"
      "sudo sed -i 's#^APP_IMAGE=.*#APP_IMAGE=$APP_IMAGE#' $REMOTE_DIR/.env 2>/dev/null || true; printf 'APP_IMAGE=%s\nAPP_PORT=%s\n' '$APP_IMAGE' '$APP_PORT' | sudo tee $REMOTE_DIR/.env >/dev/null"
    - >-
      ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST"
      "cd $REMOTE_DIR && sudo docker compose --env-file .env pull && sudo docker compose --env-file .env up -d --remove-orphans && sudo docker compose ps"
    - >-
      ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST"
      "sudo rm -f $REMOTE_DIR/registry-key.json"
